[project]
name = "deepsift"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "polars>=1.44.2",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "typesafe-sdk>=0.7.1",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["services/pipeline"]
testpaths = ["services/pipeline/tests"]
